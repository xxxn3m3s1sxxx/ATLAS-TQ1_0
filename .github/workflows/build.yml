name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "atlas_api.cpp"
      - "atlas_ffi.h"
  pull_request:
    branches: [master]
    paths:
      - "atlas_api.cpp"
      - "atlas_ffi.h"
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-13  # Intel (AVX2) — macos-latest is ARM64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/Clang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libomp-dev

      - name: Install LLVM/Clang (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm libomp

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: clang++ -fopenmp -O2 -mavx2 -mfma -mf16c -ffast-math -std=c++17 -fPIC -shared -o libatlas.so atlas_api.cpp -lgomp

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          LLVM_PREFIX=$(brew --prefix llvm)
          $LLVM_PREFIX/bin/clang++ -fopenmp -O2 -mavx2 -mfma -mf16c -ffast-math -std=c++17 -fPIC -shared -o libatlas.so atlas_api.cpp -L$LLVM_PREFIX/lib -lomp
          echo "DYLD_LIBRARY_PATH=$LLVM_PREFIX/lib:${DYLD_LIBRARY_PATH:-}" >> $GITHUB_ENV

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmDir = "C:\Program Files\LLVM"
          if (-not (Test-Path $llvmDir)) { throw "LLVM not found at $llvmDir" }
          # Build
          clang++ -fopenmp -O2 -mavx2 -mfma -mf16c -ffast-math -std=c++17 -shared -o atlas.dll atlas_api.cpp "$llvmDir\lib\libomp.lib"
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          # Diagnose DLL dependencies
          Get-Command dumpbin -ErrorAction SilentlyContinue | Out-Null
          if ($?) { dumpbin /dependents atlas.dll } else { Write-Output "dumpbin not available" }
          Write-Output "=== LLVM bin DLLs ==="
          Get-ChildItem "$llvmDir\bin\*.dll" -Name -ErrorAction SilentlyContinue
          Write-Output "=== Looking for libomp.dll ==="
          $found = $false
          Get-ChildItem "$llvmDir" -Filter "libomp*" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "  Found: $($_.FullName)"
            Copy-Item $_.FullName -Destination . -Force
            $found = $true
          }
          if (-not $found) {
            # Try vcpkg
            $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { $env:VCPKG_ROOT }
            if ($vcpkgRoot) {
              Get-ChildItem "$vcpkgRoot" -Filter "libomp*" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Output "  vcpkg: $($_.FullName)"
                Copy-Item $_.FullName -Destination . -Force
                $found = $true
              }
            }
          }
          if (-not $found) { Write-Output "::warning::libomp.dll not found anywhere" }
          # Add LLVM bin to PATH for good measure
          echo "$llvmDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: python tests/ci_smoke.py

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: python tests/ci_smoke.py

      - name: Smoke test + pytest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KMP_DUPLICATE_LIB_OK="TRUE"
          python tests/ci_smoke.py
          python -m pytest tests/ -v

      - name: Upload artifact (release only)
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ runner.os }}
          path: |
            atlas.dll
            libatlas.so
