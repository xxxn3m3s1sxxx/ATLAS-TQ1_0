name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "atlas_api.cpp"
      - "atlas_ffi.h"
  pull_request:
    branches: [master]
    paths:
      - "atlas_api.cpp"
      - "atlas_ffi.h"
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-13  # Intel (AVX2) — macos-latest is ARM64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/Clang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libomp-dev

      - name: Install LLVM/Clang (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm libomp

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: clang++ -fopenmp -O2 -mavx2 -mfma -mf16c -ffast-math -std=c++17 -fPIC -shared -o libatlas.so atlas_api.cpp -lgomp

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          LLVM_PREFIX=$(brew --prefix llvm)
          $LLVM_PREFIX/bin/clang++ -fopenmp -O2 -mavx2 -mfma -mf16c -ffast-math -std=c++17 -fPIC -shared -o libatlas.so atlas_api.cpp -L$LLVM_PREFIX/lib -lomp
          echo "DYLD_LIBRARY_PATH=$LLVM_PREFIX/lib:${DYLD_LIBRARY_PATH:-}" >> $GITHUB_ENV

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmDir = "C:\Program Files\LLVM"
          if (-not (Test-Path $llvmDir)) { throw "LLVM not found at $llvmDir" }
          Write-Output "LLVM: $llvmDir"
          # Build
          clang++ -fopenmp -O2 -mavx2 -mfma -mf16c -ffast-math -std=c++17 -shared -o atlas.dll atlas_api.cpp "$llvmDir\lib\libomp.lib"
          # Find libomp.dll — try multiple locations
          $ompPaths = @(
            "$llvmDir\bin\libomp.dll",
            "${env:VCPKG_ROOT}\installed\x64-windows\bin\libomp.dll",
            "${env:VCPKG_INSTALLATION_ROOT}\installed\x64-windows\bin\libomp.dll"
          )
          $ompDll = $null
          foreach ($pattern in $ompPaths) {
            $dll = Resolve-Path $pattern -ErrorAction SilentlyContinue
            if ($dll) { $ompDll = $dll.Path; break }
          }
          if ($ompDll) {
            Copy-Item $ompDll -Destination . -Force
            Write-Output "libomp.dll: $ompDll"
          } else {
            Write-Output "::warning::libomp.dll not found — downloading"
            $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/OpenMP-19.1.7-win64.zip"
            Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\openmp.zip"
            Expand-Archive "$env:TEMP\openmp.zip" -DestinationPath "$env:TEMP\openmp" -Force
            Copy-Item "$env:TEMP\openmp\bin\libomp.dll" -Destination . -Force
          }
          # Add to PATH for runtime loading
          echo "$llvmDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: python tests/ci_smoke.py

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: python tests/ci_smoke.py

      - name: Smoke test + pytest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KMP_DUPLICATE_LIB_OK="TRUE"
          python tests/ci_smoke.py
          python -m pytest tests/ -v

      - name: Upload artifact (release only)
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ runner.os }}
          path: |
            atlas.dll
            libatlas.so
