name: Build

on:
  workflow_dispatch:
    inputs:
      enable_profiling:
        description: 'Enable ARM64 FFN micro-profiling (-DPROFILE_MODE)'
        required: false
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - "atlas_api.cpp"
      - "atlas_vnni.cpp"
      - "atlas_kernel_arm64.cpp"
      - "atlas_cli.cpp"
      - "atlas_ffi.h"
      - "atlas_infer.py"
      - "atlas_server.py"
      - "compile.bat"
      - ".github/workflows/build.yml"
      - "scripts/*.py"
      - "tests/*.py"
      - "tests/*.json"
      - "fuzz/*.atlas"
  pull_request:
    branches: [master]
    paths:
      - "atlas_api.cpp"
      - "atlas_ffi.h"
  release:
    types: [published]

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check API parity (C -> Python)
        run: python scripts/check_api_parity.py
      - name: HF alignment check
        run: python scripts/verify_hf_alignment.py || echo "[WARN] HF alignment check non-fatal (network flake)"

  sanitizer-build:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/build.yml
      - name: Install LLVM/Clang + OMP
        run: sudo apt-get update && sudo apt-get install -y clang libomp-dev
      - name: Install test deps
        run: pip install --quiet pytest numpy safetensors "fastapi>=0.115.0" uvicorn
      - name: Generate test fixtures
        run: python tests/generate_test_fixtures.py tests/
      - name: Build with ASan+UBSan
        run: |
          ASAN_FLAGS="-fsanitize=address,undefined -shared-libasan -fno-omit-frame-pointer"
          clang++ $ASAN_FLAGS -fopenmp -O1 -g -mavx2 -mfma -mf16c -std=c++17 -fPIC -shared -o libatlas.so atlas_api.cpp atlas_vnni.cpp -lgomp
      - name: Run tests under ASan
        env:
          OMP_NUM_THREADS: "4"
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=0:print_stats=1:log_path=/tmp/asan"
        run: |
          ASAN_LIB=$(clang++ --print-file-name=libclang_rt.asan-x86_64.so)
          echo "ASan runtime: $ASAN_LIB"
          LD_PRELOAD=$ASAN_LIB python tests/ci_smoke.py
          LD_PRELOAD=$ASAN_LIB python -m pytest tests/test_dll.py -v
          rc=0; LD_PRELOAD=$ASAN_LIB python -m pytest tests/test_fixtures.py tests/test_mock_model.py tests/test_omp_stress.py tests/test_e2e_pipeline.py tests/test_fuzz.py -v --no-header -q 2>/tmp/asan_err.txt || rc=$?; echo "=== ASAN STDERR ==="; cat /tmp/asan_err.txt 2>/dev/null; echo "=== ASAN LOGFILE ==="; cat /tmp/asan.* 2>/dev/null; echo "=== EXIT CODE: $rc ==="; exit $rc
          python -c "import atlas_server; print('[CI] atlas_server.py OK')"

  build:
    needs: sanitizer-build
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/build.yml
      - name: Install test deps
        run: pip install --quiet pytest numpy safetensors "fastapi>=0.115.0" uvicorn gcovr
      - name: Install LLVM/Clang
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libomp-dev
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          clang++ -fopenmp -O2 -mavx2 -mfma -mf16c -ffast-math -std=c++17 -fPIC -shared -o libatlas.so atlas_api.cpp atlas_vnni.cpp -lgomp
          clang++ -std=c++17 -O2 -c atlas_cli.cpp -o atlas_cli.o
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmDir = "C:\Program Files\LLVM"
          if (-not (Test-Path $llvmDir)) { throw "LLVM not found at $llvmDir" }
          clang++ -fopenmp -O2 -mavx2 -mfma -mf16c -ffast-math -std=c++17 -shared -o atlas.dll atlas_api.cpp atlas_vnni.cpp "$llvmDir\lib\libomp.lib"
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          Copy-Item "$llvmDir\bin\*.dll" -Destination . -Force -ErrorAction SilentlyContinue
          Write-Output "=== Copied $(@(Get-ChildItem *.dll).Count) DLLs ==="
          echo "$llvmDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          clang++ -std=c++17 -O2 -c atlas_cli.cpp -o atlas_cli.obj
      - name: Generate test fixtures
        shell: pwsh
        run: python tests/generate_test_fixtures.py tests/
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: |
          python tests/ci_smoke.py
          python -m pytest tests/test_dll.py -v
          python -m pytest tests/test_fixtures.py -v
          python -c "import atlas_server; print('[CI] atlas_server.py OK')"
          clang++ -std=c++17 -O2 -o atlas_cli atlas_cli.cpp -ldl
          ./atlas_cli --help > /dev/null && echo "[CI] atlas_cli --help OK"
          ./atlas_cli tests/trilm-v6.atlas "test" --temp 0 --max-new 5 --max-seq 256 > /dev/null 2>&1 && echo "[CI] atlas_cli E2E OK" || echo "[WARN] atlas_cli E2E skipped (no libatlas.so in PATH)"
      - name: Coverage (Linux)
        if: runner.os == 'Linux'
        run: |
          GCOV_TOOL="gcov"
          if command -v llvm-cov-19 &>/dev/null; then
            GCOV_TOOL="llvm-cov-19 gcov"
          elif command -v llvm-cov-18 &>/dev/null; then
            GCOV_TOOL="llvm-cov-18 gcov"
          elif command -v llvm-cov &>/dev/null; then
            GCOV_TOOL="llvm-cov gcov"
          else
            apt-get install -y -qq llvm 2>/dev/null && GCOV_TOOL="llvm-cov gcov"
          fi
          echo "Using GCOV tool: $GCOV_TOOL"
          clang++ -fopenmp -O0 -g -mavx2 -mfma -mf16c -ffast-math -std=c++17 -fPIC -shared -o libatlas_cov.so atlas_api.cpp atlas_vnni.cpp -lgomp --coverage
          cp libatlas_cov.so libatlas.so
          python -m pytest tests/test_fixtures.py tests/test_mock_model.py tests/test_omp_stress.py tests/test_e2e_pipeline.py -q --no-header
          python -m gcovr --gcov-executable "$GCOV_TOOL" --html-details coverage.html --root . --filter "atlas_api\.cpp" --gcov-ignore-parse-errors
          python -m gcovr --gcov-executable "$GCOV_TOOL" --json-summary coverage_summary.json --root . --filter "atlas_api\.cpp" --gcov-ignore-parse-errors
          python scripts/check_coverage_thresholds.py coverage_summary.json
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KMP_DUPLICATE_LIB_OK="TRUE"
          python tests/ci_smoke.py
          python -m pytest tests/test_dll.py -v
          $env:GENERATE_GOLDEN="1"
          python -m pytest tests/test_fixtures.py::test_golden_regression -v --no-header -q 2>$null
          $env:GENERATE_GOLDEN="0"
          python -m pytest tests/test_fixtures.py -v
          python -c "import atlas_server; print('[CI] atlas_server.py OK')"
      - name: Coverage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmDir = "C:\Program Files\LLVM"
          if (-not (Test-Path $llvmDir)) { throw "LLVM not found" }
          Remove-Item -Force -Path *.gcda, *.gcno -ErrorAction SilentlyContinue
          clang++ -fopenmp -O0 -g -mavx2 -mfma -mf16c -ffast-math -std=c++17 -shared -o atlas_cov.dll atlas_api.cpp atlas_vnni.cpp "$llvmDir\lib\libomp.lib" --coverage
          Copy-Item "$llvmDir\bin\*.dll" -Destination . -Force -ErrorAction SilentlyContinue
          $env:KMP_DUPLICATE_LIB_OK="TRUE"
          Move-Item atlas.dll atlas.dll.bak -Force
          Move-Item atlas_cov.dll atlas.dll -Force
          python -m pytest tests/test_fixtures.py tests/test_mock_model.py tests/test_omp_stress.py tests/test_e2e_pipeline.py -q --no-header
          Move-Item atlas.dll.bak atlas.dll -Force
          python -m gcovr --gcov-executable "llvm-cov gcov" --html-details coverage.html --root . --filter "atlas_api\.cpp" --gcov-ignore-parse-errors
          python -m gcovr --gcov-executable "llvm-cov gcov" --json-summary coverage_summary.json --root . --filter "atlas_api\.cpp" --gcov-ignore-parse-errors
          python scripts/check_coverage_thresholds.py coverage_summary.json
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ runner.os }}
          path: coverage.*
          if-no-files-found: ignore

  build-macos:
    needs: sanitizer-build
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/build.yml
      - name: Install LLVM/Clang
        run: brew install llvm libomp
      - name: Install test deps
        run: pip install --break-system-packages --quiet pytest numpy safetensors "fastapi>=0.115.0" uvicorn
      - name: Build
        run: |
          LLVM_PREFIX=$(brew --prefix llvm)
          $LLVM_PREFIX/bin/clang++ -fopenmp -O2 -mavx2 -mfma -mf16c -ffast-math -std=c++17 -fPIC -shared -o libatlas.so atlas_api.cpp atlas_vnni.cpp -L$LLVM_PREFIX/lib -lomp
          echo "DYLD_LIBRARY_PATH=$LLVM_PREFIX/lib:${DYLD_LIBRARY_PATH:-}" >> $GITHUB_ENV
          $LLVM_PREFIX/bin/clang++ -std=c++17 -O2 -c atlas_cli.cpp -o atlas_cli.o
      - name: Generate test fixtures
        run: python tests/generate_test_fixtures.py tests/
      - name: Test
        run: |
          python tests/ci_smoke.py
          python -m pytest tests/test_dll.py -v
          python -m pytest tests/test_fixtures.py -v
          python -m pytest tests/test_mock_model.py tests/test_matmul_parity.py -v
          python -c "import atlas_server; print('[CI] atlas_server.py OK')"
      - name: Upload artifact (release only)
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-macOS
          path: libatlas.so

  build-macos-arm64:
    if: github.event_name != 'release'
    needs: sanitizer-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/build.yml
      - name: Install LLVM/Clang
        run: brew install llvm libomp
      - name: Install test deps
        run: pip install --break-system-packages --quiet pytest numpy safetensors "fastapi>=0.115.0" uvicorn
      - name: Build (ARM64 NEON)
        run: |
          LLVM_PREFIX=$(brew --prefix llvm)
          PROFILE_FLAG="${{ inputs.enable_profiling == true && '-DPROFILE_MODE' || '' }}"
          echo "=== PROFILE_FLAG=[${PROFILE_FLAG}] ==="
          $LLVM_PREFIX/bin/clang++ -fopenmp -O2 -march=armv8.2-a+dotprod -ffast-math -std=c++17 -fPIC -shared -D__aarch64__ $PROFILE_FLAG -o libatlas.so atlas_api.cpp atlas_kernel_arm64.cpp -L$LLVM_PREFIX/lib -lomp
          echo "=== Binary profiling symbols ==="
          nm -S libatlas.so | grep -E "profile_print|g_prof_" || echo "(none found)"
          echo "=== End binary check ==="
          echo "DYLD_LIBRARY_PATH=$LLVM_PREFIX/lib:${DYLD_LIBRARY_PATH:-}" >> $GITHUB_ENV
          $LLVM_PREFIX/bin/clang++ -std=c++17 -O2 -c atlas_cli.cpp -o atlas_cli.o
      - name: Generate test fixtures
        run: python tests/generate_test_fixtures.py tests/
      - name: Test
        run: |
          python tests/ci_smoke.py
          python -m pytest tests/test_dll.py -v
          python -m pytest tests/test_fixtures.py -v
          python -c "import atlas_server; print('[CI] atlas_server.py OK')"
      - name: Profiling benchmark
        if: inputs.enable_profiling == true
        shell: bash
        run: |
          echo "=== Starting profiling benchmark ==="
          set +e
          python -c "
          import sys, ctypes
          sys.stderr.write('[PROFILE] Python benchmark script started\n')
          import atlas_infer
          sys.stderr.write('[PROFILE] atlas_infer imported OK\n')
          m = atlas_infer.AtlasModel('tests/falcon3_v6.atlas')
          m.set_use_f32_matmul(False)
          input_ids = (ctypes.c_int * 2)(1, 1)
          out_arr = (ctypes.c_int * 50)()
          n_gen = atlas_infer.dll.atlas_generate(
          m.model_ptr, input_ids, 2,
          256, 50,
          0.7, 40, 0.9, 1.0, 0, 0, out_arr)
          print('n_gen:', n_gen)
          " 2>profiling_stderr.txt
          echo "=== PROFILING OUTPUT ==="
          cat profiling_stderr.txt
          [ -s profiling_stderr.txt ] || echo "[WARN] No profiling output in stderr"
          echo "=== End profiling benchmark ==="
      - name: Upload profiling artifact
        if: inputs.enable_profiling == true
        uses: actions/upload-artifact@v4
        with:
          name: profiling-arm64
          path: profiling_stderr.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-macOS-ARM64
          path: libatlas.so
