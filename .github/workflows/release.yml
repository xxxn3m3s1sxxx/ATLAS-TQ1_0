name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build DLL
        shell: pwsh
        run: |
          $llvmDir = "C:\Program Files\LLVM"
          if (-not (Test-Path $llvmDir)) { throw "LLVM not found at $llvmDir" }
          clang++ -fopenmp -O2 -mavx2 -mfma -mf16c -ffast-math -std=c++17 -shared -o atlas.dll atlas_api.cpp atlas_vnni.cpp "$llvmDir\lib\libomp.lib"
          if ($LASTEXITCODE -ne 0) { throw "DLL build failed" }

      - name: Build CLI
        shell: pwsh
        run: |
          clang++ -o atlas.exe atlas_cli.cpp -O2 -std=c++17 -lshell32
          if ($LASTEXITCODE -ne 0) { throw "CLI build failed" }

      - name: Collect runtime DLLs
        shell: pwsh
        run: |
          $llvmDir = "C:\Program Files\LLVM"
          Copy-Item "$llvmDir\bin\libomp.dll" -Destination . -Force
          Copy-Item "$llvmDir\bin\libc++.dll" -Destination . -Force -ErrorAction SilentlyContinue
          Copy-Item "$llvmDir\bin\libunwind.dll" -Destination . -Force -ErrorAction SilentlyContinue
          Copy-Item "$llvmDir\bin\libwinpthread-1.dll" -Destination . -Force -ErrorAction SilentlyContinue
          Write-Output "=== Release files ==="
          Get-ChildItem *.exe,*.dll | ForEach-Object { Write-Output "$($_.Name) — $($_.Length/1MB -as [int]) MB" }

      - name: Smoke test — generate mock model
        shell: pwsh
        run: |
          pip install numpy pytest -q
          python tests/create_mock_model.py tests/mock.atlas
          if ($LASTEXITCODE -ne 0) { throw "Mock model creation failed" }

      - name: Smoke test — load + generate
        shell: pwsh
        run: |
          python -m pytest tests/test_mock_model.py -q --no-header
          if ($LASTEXITCODE -ne 0) { throw "Smoke test failed" }

      - name: Create Release Zip
        shell: pwsh
        run: |
          $files = @("atlas.exe","atlas.dll","atlas_ffi.h") + @("libomp.dll","libc++.dll","libunwind.dll","libwinpthread-1.dll") | Where-Object { Test-Path $_ }
          Write-Output "=== Packaging $($files.Count) files ==="
          $files | ForEach-Object { Write-Output "  $_ ($((Get-Item $_).Length/1KB -as [int]) KB)" }
          Compress-Archive -Path $files -DestinationPath atlas-windows-x86_64.zip -Force

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: atlas-windows-x86_64.zip
          fail_on_unmatched_files: true

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang + OpenMP
        run: sudo apt-get update && sudo apt-get install -y clang libomp-dev

      - name: Build shared library
        run: |
          clang++ -fopenmp -O2 -mavx2 -mfma -mf16c -ffast-math -std=c++17 -fPIC -shared -o libatlas.so atlas_api.cpp atlas_vnni.cpp -lgomp

      - name: Build CLI (Linux)
        run: |
          clang++ -o atlas atlas_cli.cpp -O2 -std=c++17 -ldl

      - name: Smoke test — generate mock model
        run: |
          python3 -m pip install numpy pytest -q
          python3 tests/create_mock_model.py tests/mock.atlas

      - name: Smoke test — load + generate
        run: |
          LD_LIBRARY_PATH=$PWD python3 -m pytest tests/test_mock_model.py -q --no-header

      - name: Create Release Tar
        run: |
          tar czf atlas-linux-x86_64.tar.gz libatlas.so atlas atlas_ffi.h

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: atlas-linux-x86_64.tar.gz
          fail_on_unmatched_files: true

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang + OpenMP
        run: brew install llvm libomp

      - name: Build shared library (ARM64 NEON)
        run: |
          LLVM_PREFIX=$(brew --prefix llvm)
          $LLVM_PREFIX/bin/clang++ -fopenmp -O2 -march=armv8.2-a+dotprod -ffast-math -std=c++17 -fPIC -shared -o libatlas.so atlas_api.cpp atlas_kernel_arm64.cpp -L$LLVM_PREFIX/lib -lomp

      - name: Build CLI
        run: |
          LLVM_PREFIX=$(brew --prefix llvm)
          $LLVM_PREFIX/bin/clang++ -o atlas atlas_cli.cpp -O2 -std=c++17 -ldl

      - name: Smoke test — generate mock model
        run: |
          python3 -m pip install --break-system-packages numpy pytest -q
          python3 tests/create_mock_model.py tests/mock.atlas

      - name: Smoke test — load + generate
        run: |
          DYLD_LIBRARY_PATH=$PWD python3 -m pytest tests/test_mock_model.py -q --no-header

      - name: Create Release Tar
        run: |
          tar czf atlas-macos-arm64.tar.gz libatlas.so atlas atlas_ffi.h

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: atlas-macos-arm64.tar.gz
          fail_on_unmatched_files: true
