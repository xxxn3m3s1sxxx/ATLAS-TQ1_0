[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "atlas-tq1"
version = "2.17.0"
description = "ATLAS TQ1.0 CPU inference engine — MLA + MoE DeepSeek-V2 support"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "safetensors>=0.4",
]
keywords = ["bitnet", "ternary", "llm", "inference", "cpu", "tq1"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/xxxn3m3s1sxxx/ATLAS-TQ1_0"
Source = "https://github.com/xxxn3m3s1sxxx/ATLAS-TQ1_0"

[project.scripts]
atlas-pack = "atlas_pack:main"

[tool.setuptools.packages.find]
include = ["atlas*"]
